<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMO &amp; BROCCOLI — laotour-log</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  :root {
    --wood-dark: #2b1d14;
    --wood: #3d2a1c;
    --wood-light: #4e3826;
    --board: #e9dfc8;
    --board-hole: #cabd9c;
    --ink: #2b1d14;
    --ink-light: #6b5c48;
    --paper: #f3ecd9;
    --accent: #b23b2e;
    --peg-black: #1a1a1a;
    --peg-white: #f4f1e8;
    /* ページ全体（背景と、盤面の外の見出し・文字）の配色。盤面自体の木目・紙色（上記）はテーマに関わらず固定 */
    --page-bg: #f3ecd9;
    --page-fg: #2b1d14;
    --page-fg-muted: #6b5c48;
  }

  :root[data-theme="dark"] {
    --page-bg: #2b1d14;
    --page-fg: #f3ecd9;
    --page-fg-muted: #e3d3ae;
  }

  html, body { height: 100%; }

  body {
    background: var(--page-bg);
    background-image:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.06) 0px, transparent 2px, transparent 40px, rgba(0,0,0,0.06) 42px),
      radial-gradient(ellipse at 30% 0%, rgba(255,200,140,0.05) 0%, transparent 55%);
    color: var(--page-fg);
    transition: background 0.2s ease, color 0.2s ease;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  .top-row {
    width: 100%;
    max-width: 560px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
  }
  .back-link {
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 4px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    letter-spacing: 0.04em;
    color: var(--page-fg-muted);
    text-decoration: none;
  }
  .back-link:hover { color: var(--page-fg); }

  .theme-toggle {
    background: transparent;
    border: 1px solid var(--page-fg-muted);
    color: var(--page-fg-muted);
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .theme-toggle:hover { color: var(--page-fg); border-color: var(--page-fg); }
  .theme-toggle svg { width: 20px; height: 20px; }

  header { text-align: center; margin-bottom: 22px; }
  h1 {
    font-family: 'Special Elite', 'Courier New', monospace;
    font-size: clamp(2.8rem, 9vw, 4.6rem);
    letter-spacing: 0.06em;
    color: var(--page-fg);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
  }
  .tagline {
    margin-top: 8px;
    font-size: 1rem;
    letter-spacing: 0.1em;
    color: var(--page-fg-muted);
  }
  .objective {
    margin-top: 6px;
    font-size: 1rem;
    letter-spacing: 0.04em;
    color: var(--page-fg);
  }

  /* ── SETTINGS ── */
  .settings {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
    max-width: 560px;
  }
  .setting-group {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--wood-light);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px;
    padding: 5px 8px;
  }
  .setting-label {
    font-size: 1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #e3d3ae;
    padding-right: 4px;
  }
  .setting-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    letter-spacing: 0.06em;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.15);
    color: #ecdcb8;
    padding: 6px 13px;
    border-radius: 2px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .setting-btn:hover { border-color: var(--accent); color: var(--paper); }
  .setting-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .setting-btn.retry-btn {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: bold;
  }
  .setting-btn.retry-btn:hover { background: #8f2e24; border-color: #8f2e24; }

  /* ── STATUS ── */
  .status-row {
    display: flex;
    gap: 28px;
    margin-bottom: 18px;
  }
  .status-item { text-align: center; min-height: 2.4rem; display: flex; flex-direction: column; justify-content: center; }
  .status-val {
    font-family: 'Special Elite', monospace;
    font-size: 2rem;
    line-height: 1;
    color: var(--page-fg);
  }
  .status-lbl {
    font-size: 1rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--page-fg-muted);
    margin-top: 4px;
  }

  /* ── THE BOARD ── */
  .board-frame {
    background: linear-gradient(160deg, var(--wood-light), var(--wood) 60%);
    border: 6px solid var(--wood-dark);
    border-radius: 8px;
    padding: 18px 16px 14px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.04);
    width: min(94vw, 520px);
  }

  .history {
    display: flex;
    flex-direction: column-reverse;
    gap: 6px;
    margin-bottom: 10px;
  }

  .hrow {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--board);
    border-radius: 4px;
    padding: 7px 10px;
    animation: rowIn 0.25s ease both;
  }
  @keyframes rowIn { from { opacity:0; transform: translateY(-6px);} to {opacity:1; transform:translateY(0);} }

  .hrow-idx {
    font-family: 'Special Elite', monospace;
    font-size: 1.05rem;
    color: var(--ink-light);
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }
  .hrow-pegs { display: flex; gap: 6px; flex: 1; }
  .peg-slot {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--board-hole);
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.25);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .peg {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #f8f4e8;
    box-shadow: inset -2px -3px 4px rgba(0,0,0,0.15), inset 2px 2px 3px rgba(255,255,255,0.6), 0 1px 2px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .peg svg, .pal-swatch svg { width: 68%; height: 68%; }
  .hrow-feedback {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--board-hole);
    border-radius: 4px;
    padding: 7px 12px;
    flex-shrink: 0;
  }
  .fb-count {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Special Elite', monospace;
    font-size: 1.3rem;
    color: var(--ink);
  }
  .fb-dot {
    width: 18px; height: 18px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .fb-dot.hit { background: var(--peg-black); box-shadow: inset 1px 1px 1px rgba(255,255,255,0.3); }
  .fb-dot.blow { background: var(--peg-white); border: 1.5px solid var(--ink-light); box-shadow: inset -1px -1px 1px rgba(0,0,0,0.15); }

  /* secret answer row — hidden until win/lose, then flips open */
  .secret-panel {
    position: relative;
    background: rgba(0,0,0,0.05);
    border: 1.5px dashed var(--ink-light);
    border-radius: 6px;
    padding: 14px 10px 10px;
  }
  .secret-panel::before {
    content: '🔒';
    position: absolute;
    top: -11px; left: 12px;
    background: var(--paper);
    padding: 0 6px;
    font-size: 1rem;
    line-height: 1;
  }
  .secret-row {
    display: flex;
    gap: 8px;
    justify-content: center;
    perspective: 700px;
  }
  .row-divider {
    border-top: 1px dashed rgba(0,0,0,0.15);
    margin: 2px 4px;
  }
  .secret-slot {
    width: 60px; height: 60px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .secret-slot.flip { animation: secretFlip 0.6s ease; }
  @keyframes secretFlip {
    0%   { transform: rotateY(0deg); }
    50%  { transform: rotateY(90deg); }
    100% { transform: rotateY(0deg); }
  }
  .secret-slot .peg { width: 50px; height: 50px; }
  .secret-peg-hidden {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--wood-light);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    color: var(--paper);
  }

  /* current guess row */
  .current-row {
    background: var(--paper);
    border-radius: 5px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
  }
  .current-slots { display: flex; gap: 8px; justify-content: center; }
  .cur-slot {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: var(--board-hole);
    box-shadow: inset 0 3px 5px rgba(0,0,0,0.3);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.08s;
    position: relative;
  }
  .cur-slot:hover { transform: scale(1.05); }
  .cur-slot .peg { width: 50px; height: 50px; }
  .cur-slot.next::after {
    content: '';
    position: absolute; inset: -3px;
    border: 2px dashed var(--accent);
    border-radius: 50%;
    opacity: 0.6;
    animation: pulse 1.2s ease infinite;
  }
  @keyframes pulse { 0%,100% {opacity:0.3;} 50% {opacity:0.7;} }

  .palette { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .pal-swatch {
    width: 54px; height: 54px;
    border-radius: 50%;
    cursor: pointer;
    background: #f8f4e8;
    box-shadow: inset -2px -3px 4px rgba(0,0,0,0.15), inset 2px 2px 3px rgba(255,255,255,0.6), 0 2px 4px rgba(0,0,0,0.3);
    transition: transform 0.1s;
    border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
  }
  .pal-swatch:hover { transform: translateY(-3px); }

  .row-actions { display: flex; gap: 8px; justify-content: center; }
  .action-btn {
    font-family: 'Share Tech Mono', monospace;
    font-size: 1rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 10px 22px;
    border: 1.5px solid var(--ink);
    background: transparent;
    color: var(--ink);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .action-btn:hover { background: var(--ink); color: var(--paper); }
  .action-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .action-btn.primary:hover { background: #8f2e24; }
  .action-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .action-btn:disabled:hover { background: transparent; color: var(--ink); }
  .action-btn.primary:disabled:hover { background: var(--accent); color: #fff; }

  .legend {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 1.05rem;
    color: #e3d3ae;
    letter-spacing: 0.02em;
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .legend .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--paper); box-sizing: border-box; flex-shrink: 0; }
  .legend .dot.hit { background: var(--peg-black); }
  .legend .dot.blow { background: var(--peg-white); }

  /* ── WIN OVERLAY ── */
  .win-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,13,8,0.92);
    z-index: 200;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
  }
  .win-overlay.show { display: flex; }
  .imo-big {
    font-family: 'Special Elite', monospace;
    font-size: clamp(4.5rem, 22vw, 9rem);
    color: var(--accent);
    text-shadow: 3px 3px 0 rgba(0,0,0,0.45);
    line-height: 1;
    animation: imoPop 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes imoPop {
    0%   { transform: scale(0) rotate(-12deg); opacity: 0; }
    55%  { transform: scale(1.2) rotate(6deg); opacity: 1; }
    75%  { transform: scale(0.95) rotate(-2deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .win-title {
    font-family: 'Special Elite', monospace;
    font-size: clamp(2rem, 8vw, 3.5rem);
    color: var(--paper);
    animation: fadeup 0.5s 0.55s both ease;
  }
  .win-sub { font-size: 1rem; letter-spacing: 0.1em; color: #ecdcb8; animation: fadeup 0.5s 0.7s both ease; }
  .win-hint {
    font-size: 1rem;
    letter-spacing: 0.15em;
    color: #e3d3ae;
    margin-top: 14px;
    animation: fadeup 0.5s 0.9s both ease;
  }
  @keyframes fadeup { from{opacity:0; transform: translateY(14px);} to{opacity:1; transform: translateY(0);} }
</style>
</head>
<body>

<div class="top-row">
  <a class="back-link" href="../index.html">← GAME ROOM</a>
  <button class="theme-toggle" id="theme-toggle" aria-label="配色を切り替え">
    <svg id="theme-icon-moon" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg>
    <svg id="theme-icon-light" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.45 1 1.1 1.1 1.85V16h4.8v-.25c0-.75.4-1.4 1-1.85A6 6 0 0 0 12 3Z"/></svg>
  </button>
</div>

<header>
  <h1>IMO &amp; BROCCOLI</h1>
  <div class="tagline">Hit &amp; Blow</div>
  <div class="objective">隠された野菜を当てよう</div>
</header>

<div class="settings">
  <div class="setting-group">
    <span class="setting-label">桁数</span>
    <button class="setting-btn" data-len="3">3</button>
    <button class="setting-btn active" data-len="4">4</button>
  </div>
  <div class="setting-group">
    <span class="setting-label">重複</span>
    <button class="setting-btn active" data-rep="1">あり</button>
    <button class="setting-btn" data-rep="0">なし</button>
  </div>
  <div class="setting-group">
    <button class="setting-btn retry-btn" id="restartBtn">リトライ</button>
  </div>
</div>

<div class="status-row">
  <div class="status-item">
    <div class="status-val" id="attemptsVal">0/10</div>
    <div class="status-lbl">Attempts</div>
  </div>
</div>

<div class="board-frame">
  <div class="legend">
    <span><span class="dot hit"></span> Hit（位置も野菜も正解）</span>
    <span><span class="dot blow"></span> Blow（野菜のみ正解）</span>
  </div>

  <div class="current-row">
    <div class="secret-panel">
      <div class="secret-row" id="secretRow"></div>
    </div>
    <div class="row-divider"></div>
    <div class="current-slots" id="currentSlots"></div>
    <div class="palette" id="palette"></div>
    <div class="row-actions">
      <button class="action-btn" id="clearBtn">リセット</button>
      <button class="action-btn primary" id="submitBtn" disabled>推理する</button>
    </div>
  </div>

  <div class="history" id="history"></div>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="imo-big">IMO!</div>
  <div class="win-title">CRACKED!</div>
  <div class="win-sub" id="winSub"></div>
  <div class="win-hint">タップして閉じる</div>
</div>

<div class="win-overlay" id="loseOverlay">
  <div class="win-title" style="color: var(--accent);">OUT OF TRIES</div>
  <div class="win-sub">10回以内に当てられませんでした</div>
  <div class="win-hint">タップして閉じる</div>
</div>

<script>
// ============================================================
// PEG PALETTE — vegetables only (fixed at 6)
// ============================================================
const SVG_OPEN = '<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">';
const COLORS = [
  // tomato — red body, green calyx
  SVG_OPEN + '<circle cx="12" cy="14.5" r="7" fill="#e0432e"/><path d="M9 8.5 L10.3 6 L12 8 L13.7 6 L15 8.5 L12 9.6 Z" fill="#4f9142"/></svg>',
  // carrot — orange body, green leaf top
  SVG_OPEN + '<path d="M12 9 L16 20 C16 21 15 21.5 14 21 L10 21 C9 21.5 8 21 8 20 Z" fill="#ef8c34"/><path d="M12 9 L9.5 3 M12 9 L12 2 M12 9 L14.5 3" stroke="#4f9142" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
  // potato (imo) — tan body, darker eyes
  SVG_OPEN + '<ellipse cx="12" cy="12.5" rx="7.5" ry="5.8" fill="#c9945f"/><circle cx="9" cy="11" r="0.7" fill="#8a5a30"/><circle cx="14.5" cy="13.5" r="0.7" fill="#8a5a30"/><circle cx="12" cy="9.5" r="0.6" fill="#8a5a30"/></svg>',
  // broccoli — green florets, pale stem
  SVG_OPEN + '<rect x="10.3" y="11" width="3.4" height="10" rx="1.4" fill="#a9c281"/><circle cx="12" cy="8.5" r="3.6" fill="#4f9142"/><circle cx="8" cy="10.2" r="2.8" fill="#4f9142"/><circle cx="16" cy="10.2" r="2.8" fill="#4f9142"/></svg>',
  // eggplant — purple body, green cap
  SVG_OPEN + '<path d="M12 7 C16.5 7 17.5 13 15.5 17 C14 20 10 20 8.5 17 C6.5 13 7.5 7 12 7 Z" fill="#6a3f9e"/><ellipse cx="12" cy="7" rx="3" ry="1.3" fill="#4f9142"/><path d="M10 7.5 L9 4 M12 7 L12 3 M14 7.5 L15 4" stroke="#4f9142" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg>',
  // corn — yellow kernels, green husk
  SVG_OPEN + '<ellipse cx="12" cy="12" rx="4.3" ry="9" fill="#f2c230"/><path d="M9 5.5 L9 18.5 M12 4 L12 20 M15 5.5 L15 18.5" stroke="#c99a1f" stroke-width="0.9" fill="none"/><path d="M8.5 19 C6 20 4.5 22 4 23 C6.5 22.5 8 21.5 9 19.5 Z" fill="#4f9142"/><path d="M15.5 19 C18 20 19.5 22 20 23 C17.5 22.5 16 21.5 15 19.5 Z" fill="#4f9142"/></svg>',
];

const MAX_ATTEMPTS = 10;

const S = {
  len: 4,
  colorCount: 6,
  allowRepeat: true,
  secret: [],
  current: [],
  selected: 0,
  attempts: 0,
  over: false,
};

// ============================================================
// SETTINGS UI
// ============================================================
document.querySelectorAll('[data-len]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-len]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    S.len = +btn.dataset.len;
    newGame();
  });
});
document.querySelectorAll('[data-rep]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-rep]').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    S.allowRepeat = btn.dataset.rep === '1';
    newGame();
  });
});

document.getElementById('clearBtn').addEventListener('click', () => {
  S.current = new Array(S.len).fill(null);
  S.selected = 0;
  renderCurrent();
});
document.getElementById('submitBtn').addEventListener('click', submitGuess);
document.getElementById('restartBtn').addEventListener('click', () => {
  document.getElementById('winOverlay').classList.remove('show');
  document.getElementById('loseOverlay').classList.remove('show');
  newGame();
});
document.getElementById('winOverlay').addEventListener('click', function () {
  this.classList.remove('show');
});
document.getElementById('loseOverlay').addEventListener('click', function () {
  this.classList.remove('show');
});

// ============================================================
// GAME LOGIC
// ============================================================
function makeSecret() {
  const codes = [...Array(S.colorCount).keys()];
  const secret = [];
  if (S.allowRepeat) {
    for (let i=0;i<S.len;i++) secret.push(codes[Math.floor(Math.random()*codes.length)]);
  } else {
    const pool = [...codes];
    for (let i=0;i<S.len;i++) {
      if (pool.length === 0) { secret.push(codes[Math.floor(Math.random()*codes.length)]); continue; }
      const j = Math.floor(Math.random()*pool.length);
      secret.push(pool.splice(j,1)[0]);
    }
  }
  return secret;
}

function newGame() {
  S.secret = makeSecret();
  S.current = new Array(S.len).fill(null);
  S.selected = 0;
  S.attempts = 0;
  S.over = false;
  document.getElementById('history').innerHTML = '';
  document.getElementById('attemptsVal').textContent = `0/${MAX_ATTEMPTS}`;
  document.getElementById('submitBtn').disabled = true;
  renderPalette();
  renderCurrent();
  renderSecretRow();
}

function scoreGuess(guess) {
  let hit = 0, blow = 0;
  const secretLeft = [];
  const guessLeft = [];
  for (let i=0;i<S.len;i++) {
    if (guess[i] === S.secret[i]) hit++;
    else { secretLeft.push(S.secret[i]); guessLeft.push(guess[i]); }
  }
  const counts = {};
  secretLeft.forEach(v => counts[v] = (counts[v]||0)+1);
  guessLeft.forEach(v => {
    if (counts[v] > 0) { blow++; counts[v]--; }
  });
  return { hit, blow };
}

function submitGuess() {
  if (S.current.includes(null) || S.over) return;
  const { hit, blow } = scoreGuess(S.current);
  S.attempts++;
  document.getElementById('attemptsVal').textContent = `${S.attempts}/${MAX_ATTEMPTS}`;
  addHistoryRow(S.current.slice(), hit, blow);
  S.current = new Array(S.len).fill(null);
  S.selected = 0;
  renderCurrent();
  if (hit === S.len) {
    S.over = true;
    showWin();
  } else if (S.attempts >= MAX_ATTEMPTS) {
    S.over = true;
    showLose();
  }
}

// ============================================================
// RENDER
// ============================================================
function pegEl(colorIdx) {
  const el = document.createElement('div');
  el.className = 'peg';
  el.innerHTML = COLORS[colorIdx];
  return el;
}

function renderPalette() {
  const pal = document.getElementById('palette');
  pal.innerHTML = '';
  for (let i=0;i<S.colorCount;i++) {
    const sw = document.createElement('div');
    sw.className = 'pal-swatch';
    sw.innerHTML = COLORS[i];
    sw.addEventListener('click', () => {
      if (S.over) return;
      S.current[S.selected] = i;
      // advance to the next empty slot after this one, if any
      let next = -1;
      for (let k=1;k<=S.len;k++) {
        const idx = (S.selected + k) % S.len;
        if (S.current[idx] === null) { next = idx; break; }
      }
      if (next !== -1) S.selected = next;
      renderCurrent();
    });
    pal.appendChild(sw);
  }
}

function renderCurrent() {
  const wrap = document.getElementById('currentSlots');
  wrap.innerHTML = '';
  for (let i=0;i<S.len;i++) {
    const slot = document.createElement('div');
    slot.className = 'cur-slot' + (i === S.selected ? ' next' : '');
    if (S.current[i] !== null) {
      slot.appendChild(pegEl(S.current[i]));
    }
    slot.addEventListener('click', () => {
      if (S.over) return;
      if (S.selected === i && S.current[i] !== null) {
        // clicking the already-selected, filled slot again clears it
        S.current[i] = null;
      } else {
        S.selected = i;
      }
      renderCurrent();
    });
    wrap.appendChild(slot);
  }
  document.getElementById('submitBtn').disabled = S.current.includes(null);
}

function renderSecretRow() {
  const wrap = document.getElementById('secretRow');
  wrap.innerHTML = '';
  for (let i=0;i<S.len;i++) {
    const slot = document.createElement('div');
    slot.className = 'secret-slot';
    const hidden = document.createElement('div');
    hidden.className = 'secret-peg-hidden';
    hidden.textContent = '？';
    slot.appendChild(hidden);
    wrap.appendChild(slot);
  }
}

// Flips each secret slot open in sequence, swapping the hidden '?'
// for the real peg at the midpoint of the flip (when it's edge-on).
function revealSecretRow(callback) {
  const slots = document.getElementById('secretRow').children;
  const flipDuration = 600;
  const stagger = 150;
  for (let i=0;i<S.len;i++) {
    const slot = slots[i];
    setTimeout(() => {
      slot.classList.add('flip');
      setTimeout(() => {
        slot.innerHTML = '';
        slot.appendChild(pegEl(S.secret[i]));
      }, flipDuration / 2);
    }, i * stagger);
  }
  const totalTime = (S.len - 1) * stagger + flipDuration;
  if (callback) setTimeout(callback, totalTime);
}

function addHistoryRow(guess, hit, blow) {
  const hist = document.getElementById('history');
  const row = document.createElement('div');
  row.className = 'hrow';

  const idx = document.createElement('div');
  idx.className = 'hrow-idx';
  idx.textContent = S.attempts;
  row.appendChild(idx);

  const pegs = document.createElement('div');
  pegs.className = 'hrow-pegs';
  guess.forEach(c => {
    const slot = document.createElement('div');
    slot.className = 'peg-slot';
    slot.appendChild(pegEl(c));
    pegs.appendChild(slot);
  });
  row.appendChild(pegs);

  const fb = document.createElement('div');
  fb.className = 'hrow-feedback';

  const hitCount = document.createElement('div');
  hitCount.className = 'fb-count';
  hitCount.innerHTML = `<span class="fb-dot hit"></span>${hit}`;
  fb.appendChild(hitCount);

  const blowCount = document.createElement('div');
  blowCount.className = 'fb-count';
  blowCount.innerHTML = `<span class="fb-dot blow"></span>${blow}`;
  fb.appendChild(blowCount);

  row.appendChild(fb);

  hist.appendChild(row);
}

const VIEW_PAUSE = 900; // time to actually look at the revealed answer before the overlay covers it

function showWin() {
  revealSecretRow(() => {
    setTimeout(() => {
      document.getElementById('winSub').textContent = `${S.attempts} 回目で正解`;
      document.getElementById('winOverlay').classList.add('show');
    }, VIEW_PAUSE);
  });
}

function showLose() {
  revealSecretRow(() => {
    setTimeout(() => {
      document.getElementById('loseOverlay').classList.add('show');
    }, VIEW_PAUSE);
  });
}

// ============================================================
// THEME (light / dark)
// ============================================================

var THEME_KEY = 'imo_theme_v1';
var elThemeToggle = document.getElementById('theme-toggle');
var elThemeIconMoon = document.getElementById('theme-icon-moon');
var elThemeIconLight = document.getElementById('theme-icon-light');

function setHidden(el, isHidden) {
  if (isHidden) el.setAttribute('hidden', '');
  else el.removeAttribute('hidden');
}

function applyTheme(theme) {
  if (theme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    setHidden(elThemeIconMoon, true);
    setHidden(elThemeIconLight, false);
    elThemeToggle.setAttribute('aria-label', 'ライトモードに切り替え');
  } else {
    document.documentElement.removeAttribute('data-theme');
    setHidden(elThemeIconMoon, false);
    setHidden(elThemeIconLight, true);
    elThemeToggle.setAttribute('aria-label', 'ダークモードに切り替え');
  }
}

function loadSavedTheme() {
  try {
    return localStorage.getItem(THEME_KEY);
  } catch (e) {
    return null;
  }
}

function saveTheme(theme) {
  try {
    localStorage.setItem(THEME_KEY, theme);
  } catch (e) {
    // 保存できない環境(プライベートモード等)でも見た目の切り替え自体は続行する
  }
}

applyTheme(loadSavedTheme() === 'dark' ? 'dark' : 'light');

elThemeToggle.addEventListener('click', function () {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  saveTheme(next);
});

// ============================================================
// INIT
// ============================================================
newGame();
</script>
